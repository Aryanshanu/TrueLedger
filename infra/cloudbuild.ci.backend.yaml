# Cloud Build config for the GitHub trigger (push to main) - builds AND
# deploys the backend, unlike the plain cloudbuild.yaml at the repo root
# (which infra/deploy_backend.sh uses for a manual one-off build and only
# builds, never deploys). Kept as a separate file so this trigger-only
# path can never interfere with the already-verified manual deploy script.
#
# Self-contained: computes its own image tag from Cloud Build's built-in
# $PROJECT_ID/$SHORT_SHA substitutions rather than requiring an external
# caller to pass one in, since a GitHub trigger has no shell to compute it
# for us the way deploy_backend.sh's `$GOOGLE_CLOUD_PROJECT` does.
#
# One-time setup this trigger depends on (see docs/DEPLOYMENT.md "Continuous
# deployment from GitHub"): the Cloud Build service account needs
# roles/run.admin + roles/iam.serviceAccountUser, and the `trueledger`
# Artifact Registry repo must already exist (it does, from the manual
# deploy in step 6 of this doc).
#
# Test step runs FIRST and gates everything after it: Cloud Build runs
# steps sequentially by default (each waits for the previous one to
# succeed), so a non-zero exit here stops the build before the docker
# build or deploy steps ever run. This was the actual gap behind "CI
# passing does not gate deployment" - the separate GitHub Actions
# workflow (.github/workflows/ci.yml) running pytest and this Cloud
# Build trigger deploying were two unrelated systems watching the same
# push event, so a red GitHub Actions run never stopped this trigger
# from deploying anyway. Running the same test suite here, before this
# trigger's own deploy step, closes that gap directly without needing
# any cross-system status-check wiring between GitHub and Cloud Build.
steps:
  - name: 'python:3.11-slim'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir -r requirements.txt
        PYTHONPATH=. pytest -q
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/trueledger/trueledger-backend:${SHORT_SHA}'
      - -f
      - backend/Dockerfile
      - .
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - trueledger-backend
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/trueledger/trueledger-backend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - --platform=managed
      - --allow-unauthenticated
      # _API_KEY defaults to empty below, which sets API_KEY= (present but
      # empty) rather than omitting it - agents/config.py's
      # os.environ.get("API_KEY", "") treats both the same way (auth
      # disabled), so this trigger stays fully-open until _API_KEY is set
      # on the trigger itself (gcloud builds triggers update ... or the
      # Cloud Build console) to match the backend's chosen shared key.
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},API_KEY=${_API_KEY}'
      # 0, not 1: a trigger that redeploys on every push to main must not
      # silently keep an always-on billed instance running between pushes.
      - --min-instances=0
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/trueledger/trueledger-backend:${SHORT_SHA}'
substitutions:
  _REGION: asia-south1
  _API_KEY: ""
options:
  logging: CLOUD_LOGGING_ONLY
