<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TrueLedger — Agentic Credit Underwriting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#121a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#c9922f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c9922f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e3ab4c"/>
      <stop offset="100%" stop-color="#c9922f"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- node-graph motif: 3 specialist agents feeding one orchestrator -->
  <g transform="translate(900,60)" opacity="0.9">
    <line x1="40" y1="30" x2="150" y2="110" stroke="#3a4766" stroke-width="2"/>
    <line x1="150" y1="20" x2="150" y2="110" stroke="#3a4766" stroke-width="2"/>
    <line x1="260" y1="30" x2="150" y2="110" stroke="#3a4766" stroke-width="2"/>
    <line x1="150" y1="110" x2="150" y2="190" stroke="url(#amber)" stroke-width="2.5"/>

    <circle cx="40" cy="30" r="10" fill="#1a2439" stroke="#5c6b8f" stroke-width="1.5"/>
    <circle cx="150" cy="20" r="10" fill="#1a2439" stroke="#5c6b8f" stroke-width="1.5"/>
    <circle cx="260" cy="30" r="10" fill="#1a2439" stroke="#5c6b8f" stroke-width="1.5"/>
    <circle cx="150" cy="110" r="15" fill="#1a2439" stroke="url(#amber)" stroke-width="2"/>
    <circle cx="150" cy="190" r="11" fill="#1a2439" stroke="#4ea97e" stroke-width="2"/>

    <text x="40" y="-2" font-family="Menlo, Consolas, monospace" font-size="11" fill="#7c8bad" text-anchor="middle">BANK</text>
    <text x="150" y="-12" font-family="Menlo, Consolas, monospace" font-size="11" fill="#7c8bad" text-anchor="middle">GST</text>
    <text x="260" y="-2" font-family="Menlo, Consolas, monospace" font-size="11" fill="#7c8bad" text-anchor="middle">INVESTMENT</text>
    <text x="150" y="137" font-family="Menlo, Consolas, monospace" font-size="11" fill="#e3ab4c" text-anchor="middle">ORCHESTRATOR</text>
    <text x="150" y="217" font-family="Menlo, Consolas, monospace" font-size="11" fill="#4ea97e" text-anchor="middle">LEDGER</text>
  </g>

  <!-- wordmark -->
  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#f4f1ea">TrueLedger</text>
  <rect x="82" y="172" width="230" height="4" fill="url(#amber)"/>

  <text x="80" y="208" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#aab4cc">Agentic credit underwriting that cross-examines every financial</text>
  <text x="80" y="235" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#aab4cc">source instead of trusting one — and cites every claim it makes.</text>

  <text x="80" y="278" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5c6b8f" letter-spacing="1.5">GOOGLE CLOUD AI BUILDER CUP 2026 · BFSI TRACK · TEAM THE OUTLIERS</text>
</svg>
