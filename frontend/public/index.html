<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outliers Underwriting - Replay</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Outliers Underwriting</h1>
    <p class="subtitle">
      Agentic credit underwriting on Account Aggregator-schema data.
      <strong>Synthetic demo data only</strong> - see
      <a href="https://github.com" target="_blank" rel="noopener">docs/DATA_SCHEMA.md</a>
      for the disclosure.
    </p>
  </header>

  <main>
    <section class="controls">
      <label for="borrower-select">Borrower</label>
      <select id="borrower-select">
        <option value="b_clean">b_clean - all sources agree</option>
        <option value="b_contradiction">b_contradiction - bank vs GST disagree</option>
        <option value="b_stale_consent">b_stale_consent - consent expiring in 2 days</option>
      </select>
      <button id="evaluate-btn">Evaluate</button>
      <span id="status" class="status"></span>
    </section>

    <section id="decision-summary" class="decision-summary hidden">
      <div class="outcome-badge" id="outcome-badge"></div>
      <div>
        <div><strong>Final confidence:</strong> <span id="final-confidence"></span></div>
        <div><strong>Model confidence (pre-decay):</strong> <span id="model-confidence"></span></div>
      </div>
    </section>

    <section id="stepper" class="stepper hidden">
      <div class="stepper-track" id="stepper-track"></div>
      <div class="stepper-note">Steps 1-3 run in parallel; replay presents them in this fixed order for clarity.</div>
      <div id="step-detail" class="step-detail"></div>
    </section>

    <footer id="consent-strip" class="consent-strip hidden"></footer>
  </main>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
